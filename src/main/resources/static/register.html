<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Online Exam System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="center-flex">
    <div class="bg-glow" style="top: -10%; left: -10%;"></div>
    <div class="bg-glow" style="bottom: -10%; right: -10%; background: var(--primary-600);"></div>

    <div class="auth-container animate-fade-in">
        <div class="card glass text-center">
            <h2 style="font-size: 1.8rem; margin-bottom: 0.5rem;">Create Account</h2>
            <p class="text-muted" style="margin-bottom: 2rem;">Join our platform</p>

            <div id="error-msg" style="display: none; padding: 0.75rem; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239,68,68,0.2); border-radius: 8px; color: var(--danger); margin-bottom: 1rem; font-size: 0.9rem;"></div>

            <form id="register-form">
                <div class="input-group" style="text-align: left;">
                    <label>Full Name</label>
                    <input type="text" id="name" required placeholder="John Doe">
                </div>
                <div class="input-group" style="text-align: left;">
                    <label>Email</label>
                    <input type="email" id="email" required placeholder="name@example.com">
                </div>
                <div class="input-group" style="text-align: left;">
                    <label>Password</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Sign Up</button>
            </form>

            <p style="margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
                Already have an account? <a href="login.html" class="text-primary" style="font-weight: 500;">Sign in</a>
            </p>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');
            
            try {
                await api.post('/auth/register', { name, email, password, role: 'STUDENT' });
                window.location.href = 'login.html';
            } catch (error) {
                errorMsg.textContent = error.message || 'Registration failed.';
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>
</html>
