<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Online Exam System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="center-flex">
    <div class="bg-glow" style="top: 10%; left: 20%;"></div>
    <div class="bg-glow" style="bottom: 10%; right: 20%; background: var(--success);"></div>

    <div class="auth-container animate-fade-in">
        <div class="card glass text-center">
            <h2 style="font-size: 1.8rem; margin-bottom: 0.5rem;">Welcome Back</h2>
            <p class="text-muted" style="margin-bottom: 2rem;">Sign in to your account</p>

            <div id="error-msg" style="display: none; padding: 0.75rem; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239,68,68,0.2); border-radius: 8px; color: var(--danger); margin-bottom: 1rem; font-size: 0.9rem;"></div>

            <form id="login-form">
                <div class="input-group" style="text-align: left;">
                    <label>Email</label>
                    <input type="email" id="email" required placeholder="name@example.com">
                </div>
                <div class="input-group" style="text-align: left;">
                    <label>Password</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Sign In</button>
            </form>

            <p style="margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
                Don't have an account? <a href="register.html" class="text-primary" style="font-weight: 500;">Sign up</a>
            </p>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');
            
            try {
                const data = await api.post('/auth/login', { email, password });
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify({ email: data.email, role: data.role }));
                
                if (data.role === 'ADMIN') {
                    window.location.href = 'admin.html';
                } else {
                    window.location.href = 'student.html';
                }
            } catch (error) {
                errorMsg.textContent = error.message || 'Invalid credentials.';
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>
</html>
